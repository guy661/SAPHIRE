<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thema Spezifizieren - Synapse Summarizer</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--color-background-dark);
        }
        .card-ui {
            max-width: 600px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card-ui">
        <h1 class="card-ui-title" id="ai-question"></h1>
        <p class="card-ui-subtitle">
            Ihre Eingabe hilft der KI, die Suche für Sie zu verfeinern. Bitte geben Sie eine präzisere Beschreibung Ihres Themas an.
        </p>
        <div id="alert-container" class="mt-3" style="display: none;"></div>
        <form id="clarification-form">
            <div class="form-group">
                <label for="specification" class="form-label">Spezifizierung</label>
                <input type="text" id="specification" class="form-control" required placeholder="z.B. 'Anwendung von KI in der Krebserkennung'">
            </div>
            <button type="submit" class="btn btn-primary w-100">Spezifizierung speichern</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const clarificationForm = document.getElementById('clarification-form');
            const specificationInput = document.getElementById('specification');
            const aiQuestion = document.getElementById('ai-question');
            const alertContainer = document.getElementById('alert-container');

            const urlParams = new URLSearchParams(window.location.search);
            const question = urlParams.get('question');
            const topicId = urlParams.get('topicId');
            const userId = urlParams.get('userId');

            if (question) {
                aiQuestion.textContent = decodeURIComponent(question);
            }

            const showAlert = (message, type = 'danger') => {
                alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
                alertContainer.style.display = 'block';
                setTimeout(() => {
                    alertContainer.style.display = 'none';
                }, 4000);
            };

            clarificationForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const specification = specificationInput.value.trim();
                if (!specification) {
                    showAlert('Bitte geben Sie eine Spezifizierung an.');
                    return;
                }

                try {
                    const res = await fetch('/api/clarify-topic', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, specification })
                    });

                    if (!res.ok) {
                        const errorData = await res.json();
                        throw new Error(errorData.error || 'Fehler beim Speichern der Spezifizierung');
                    }

                    showAlert('Spezifizierung erfolgreich gespeichert!', 'success');
                    setTimeout(() => {
                        window.location.href = '/personalization';
                    }, 1500);

                } catch (err) {
                    showAlert(err.message, 'danger');
                }
            });
        });
    </script>
</body>
</html>
