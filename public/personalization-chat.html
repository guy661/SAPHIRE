<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thema Personalisieren - Synapse Summarizer</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --chat-bg: #2d3748;
            --user-msg-bg: #4a5568;
            --bot-msg-bg: #2c5282;
            --input-bg: #1a202c;
            --btn-hover: #4c51bf;
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--color-background-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--chat-bg);
            border-left: 1px solid #4a5568;
            border-right: 1px solid #4a5568;
        }

        .chat-header {
            padding: 1rem;
            background: var(--color-background-light);
            border-bottom: 1px solid #4a5568;
            text-align: center;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--color-text-primary);
        }

        .chat-messages {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-content {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            color: var(--color-text-primary);
            line-height: 1.5;
        }

        .chat-message.user {
            align-self: flex-end;
            align-items: flex-end;
        }
        .chat-message.user .message-content {
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 0.25rem;
        }

        .chat-message.bot {
            align-self: flex-start;
            align-items: flex-start;
        }
        .chat-message.bot .message-content {
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 0.25rem;
        }
        
        .message-sender {
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            color: var(--color-text-secondary);
            font-weight: bold;
        }

        .suggestion-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .suggestion-btn {
            background-color: var(--user-msg-bg);
            color: var(--color-text-primary);
            border: 1px solid #4a5568;
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .suggestion-btn:hover {
            background-color: var(--btn-hover);
        }

        .chat-input-area {
            padding: 1rem;
            background-color: var(--color-background-light);
            border-top: 1px solid #4a5568;
        }

        #chat-form {
            display: flex;
            gap: 0.5rem;
        }
        #chat-input {
            flex-grow: 1;
            background-color: var(--input-bg);
        }
        #send-btn {
            min-width: 80px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #90cdf4;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-of-type(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-of-type(2) { animation-delay: -0.16s; }
        @keyframes bounce {
          0%, 80%, 100% { transform: scale(0); }
          40% { transform: scale(1.0); }
        }

    </style>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Thema Personalisieren</h1>
        </header>

        <main class="chat-messages" id="chat-messages">
            <!-- Messages will be injected here -->
        </main>

        <footer class="chat-input-area">
            <form id="chat-form">
                <input type="text" id="chat-input" class="form-control" placeholder="Deine Antwort..." autocomplete="off" required>
                <button type="submit" id="send-btn" class="btn btn-primary">Senden</button>
            </form>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatMessages = document.getElementById('chat-messages');
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            
            const urlParams = new URLSearchParams(window.location.search);
            const dashboardId = urlParams.get('dashboardId');

            if (!dashboardId) {
                alert('Fehler: Keine Dashboard-ID gefunden. Sie werden zur Hauptseite weitergeleitet.');
                window.location.href = '/';
                return;
            }

            const showTypingIndicator = () => {
                const typingEl = document.createElement('div');
                typingEl.id = 'typing-indicator';
                typingEl.classList.add('chat-message', 'bot');
                typingEl.innerHTML = `
                    <div class="message-content typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                `;
                chatMessages.appendChild(typingEl);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            const hideTypingIndicator = () => {
                const typingEl = document.getElementById('typing-indicator');
                if (typingEl) {
                    typingEl.remove();
                }
            };

            const addMessage = (sender, text, suggestions = []) => {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('chat-message', sender);

                let suggestionsHTML = '';
                if (suggestions.length > 0) {
                    suggestionsHTML = '<div class="suggestion-buttons">';
                    suggestions.forEach(s => {
                        suggestionsHTML += `<button class="suggestion-btn">${s}</button>`;
                    });
                    suggestionsHTML += '</div>';
                }

                msgDiv.innerHTML = `
                    <div class="message-sender">${sender === 'user' ? 'Du' : 'Assistent'}</div>
                    <div class="message-content">
                        ${text.replace(/\n/g, '<br>')}
                        ${suggestionsHTML}
                    </div>
                `;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            const sendMessage = async (text) => {
                if (!text && text !== null) return; // Allow initial null message

                if (text) {
                    addMessage('user', text);
                }
                chatInput.value = '';
                showTypingIndicator();
                
                try {
                    const res = await fetch(`/api/dashboards/${dashboardId}/personalization-chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    
                    if (res.status === 401) {
                        window.location.href = '/'; // Not authenticated, redirect to main which will show login
                        return;
                    }
                    if (!res.ok) {
                         const errorData = await res.json();
                         throw new Error(errorData.message || 'Network response was not ok');
                    }
                    
                    const botResponse = await res.json();

                    hideTypingIndicator();
                    addMessage('bot', botResponse.message, botResponse.suggestions);

                    if (botResponse.isDone) {
                        chatInput.disabled = true;
                        sendBtn.disabled = true;
                        chatInput.placeholder = 'Thema gespeichert! Weiterleitung zu den Einstellungen...';
                        
                        // Redirect to the next step after a short delay
                        setTimeout(() => {
                            window.location.href = `/personalization-interval.html?dashboardId=${dashboardId}`;
                        }, 1500);
                    }

                } catch (error) {
                    hideTypingIndicator();
                    addMessage('bot', 'Entschuldigung, ein Fehler ist aufgetreten: ' + error.message);
                    console.error('Chat error:', error);
                }
            };

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendMessage(chatInput.value.trim());
            });

            chatMessages.addEventListener('click', (e) => {
                if (e.target.classList.contains('suggestion-btn')) {
                    sendMessage(e.target.textContent);
                }
            });

            // Initial load - send a null message to get the first greeting
            sendMessage(null);
        });
    </script>
</body>
</html>
