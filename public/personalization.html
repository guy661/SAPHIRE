
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalisierung - Saphire</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #ai-feedback-container {
            margin-top: -0.75rem;
            margin-bottom: 1rem;
            padding: 1rem 1.25rem;
            border: 1px solid var(--saphir-green);
            background: color-mix(in srgb, var(--saphir-green) 10%, transparent);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            transform-origin: top center;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; transform: scaleY(0.9);
            max-height: 0; overflow: hidden;
        }
        #ai-feedback-container.visible {
            opacity: 1; transform: scaleY(1);
            max-height: 500px; /* Allow space to grow */
            border-top: none;
        }
        #ai-feedback-text {
            display: flex; align-items: center; gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        #ai-feedback-text::before {
            content: '💡'; font-size: 1.5rem;
        }
        #ai-suggestion-buttons {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .suggestion-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: color-mix(in srgb, var(--saphir-blue) 30%, transparent);
            border: 1px solid var(--saphir-blue);
            color: var(--color-text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .suggestion-btn:hover {
            background-color: var(--saphir-blue);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="welcome-message">Personalisierung</h1>
            <nav class="header-nav">
                <a href="/">Home</a>
                <a href="#" id="logout-btn">Logout</a>
            </nav>
        </div>

        <div id="personalization-content">
            <h2>Ihre Forschungsinteressen</h2>
            <p>Definieren Sie hier Ihre Interessen. Nach dem Speichern gibt die KI Ihnen Feedback, um Ihr Thema zu perfektionieren.</p>
            <form id="topic-form">
                <div class="form-group">
                    <label for="main-topic">Hauptthema</label>
                    <input type="text" id="main-topic" name="main_topic" required placeholder="z.B. 'Künstliche Intelligenz in der Medizin'">
                </div>
                 <!-- AI Feedback Box -->
                <div id="ai-feedback-container">
                    <p id="ai-feedback-text"></p>
                    <div id="ai-suggestion-buttons"></div>
                </div>
                <div class="form-group">
                    <label for="include-keywords">Schlüsselwörter (muss enthalten sein, mit Komma trennen)</label>
                    <input type="text" id="include-keywords" name="include_keywords" placeholder="z.B. 'Diagnostik, Bildgebung'">
                </div>
                <div class="form-group">
                    <label for="exclude-keywords">Schlüsselwörter (muss ausgeschlossen werden, mit Komma trennen)</label>
                    <input type="text" id="exclude-keywords" name="exclude_keywords" placeholder="z.B. 'Verwaltung, Abrechnung'">
                </div>
                <button type="submit" class="btn">Speichern & Analysieren</button>
            </form>
            <div id="message-container" class="hidden"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const topicForm = document.getElementById('topic-form');
            const mainTopicInput = document.getElementById('main-topic');
            const includeKeywordsInput = document.getElementById('include-keywords');
            const excludeKeywordsInput = document.getElementById('exclude-keywords');
            const aiFeedbackContainer = document.getElementById('ai-feedback-container');
            const aiFeedbackText = document.getElementById('ai-feedback-text');
            const aiSuggestionButtons = document.getElementById('ai-suggestion-buttons');

            // --- Initial Data Load ---
            try {
                const [userRes, topicRes] = await Promise.all([ fetch('/api/user'), fetch('/api/topics') ]);
                if (!userRes.ok) { window.location.href = '/'; return; }
                const user = await userRes.json();
                document.getElementById('welcome-message').textContent = `Personalisierung für ${user.username}`;

                if (topicRes.ok) {
                    const topic = await topicRes.json();
                    if (topic) {
                        mainTopicInput.value = topic.main_topic || '';
                        includeKeywordsInput.value = topic.include_keywords || '';
                        excludeKeywordsInput.value = topic.exclude_keywords || '';
                    }
                } else { displayMessage('Thema konnte nicht geladen werden.', 'error'); }
            } catch (error) { displayMessage('Fehler beim Laden der Seite.', 'error'); }

            // --- AI Topic Interrogation Logic ---
            const interrogateTopic = async () => {
                const userTopic = {
                    main_topic: mainTopicInput.value,
                    include_keywords: includeKeywordsInput.value,
                    exclude_keywords: excludeKeywordsInput.value
                };

                if (!userTopic.main_topic.trim()) {
                    aiFeedbackContainer.classList.remove('visible');
                    return;
                }

                try {
                    const res = await fetch('/api/interrogate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(userTopic)
                    });
                    if (!res.ok) throw new Error('AI-Analyse fehlgeschlagen');
                    
                    const data = await res.json();
                    aiSuggestionButtons.innerHTML = ''; // Clear old buttons

                    if (data.needsClarification && data.suggestions?.length) {
                        aiFeedbackText.textContent = data.question;
                        aiFeedbackContainer.style.borderColor = 'var(--saphir-blue)';
                        aiFeedbackContainer.style.background = 'color-mix(in srgb, var(--saphir-blue) 10%, transparent)';
                        
                        data.suggestions.forEach(suggestion => {
                            const btn = document.createElement('button');
                            btn.textContent = suggestion;
                            btn.className = 'suggestion-btn';
                            btn.type = 'button'; // Prevent form submission
                            btn.onclick = () => {
                                mainTopicInput.value = suggestion;
                                aiFeedbackContainer.classList.remove('visible');
                                // Instantly save and re-check the new, better topic
                                topicForm.dispatchEvent(new Event('submit', { cancelable: true }));
                            };
                            aiSuggestionButtons.appendChild(btn);
                        });

                    } else {
                        aiFeedbackText.textContent = 'Dieses Thema ist spezifisch genug für eine gute Suche!';
                        aiFeedbackContainer.style.borderColor = 'var(--saphir-green)';
                        aiFeedbackContainer.style.background = 'color-mix(in srgb, var(--saphir-green) 10%, transparent)';
                    }
                    aiFeedbackContainer.classList.add('visible');

                } catch (error) {
                    console.error('Error during topic interrogation:', error);
                    aiFeedbackContainer.classList.remove('visible');
                }
            };

            // --- Form Submission Handler ---
            topicForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitButton = topicForm.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                const originalButtonText = submitButton.textContent;
                submitButton.textContent = 'Speichere...';

                try {
                    const response = await fetch('/api/topics', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            main_topic: mainTopicInput.value,
                            include_keywords: includeKeywordsInput.value,
                            exclude_keywords: excludeKeywordsInput.value
                        })
                    });
                    
                    if (!response.ok) throw new Error('Speichern fehlgeschlagen');
                    displayMessage('Thema erfolgreich gespeichert!', 'success');
                    
                    // Now run the AI analysis
                    submitButton.textContent = 'Analysiere...';
                    await interrogateTopic();

                } catch (error) {
                    displayMessage(`Fehler: ${error.message}`, 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = originalButtonText;
                }
            });

            // --- Logout & Messaging ---
            document.getElementById('logout-btn').addEventListener('click', async () => {
                try { await fetch('/api/logout', { method: 'POST' }); }
                finally { window.location.href = '/'; }
            });

            function displayMessage(message, type) {
                const container = document.getElementById('message-container');
                container.textContent = message;
                container.className = 'message-box ' + (type === 'success' ? 'success-message' : 'error-message');
                container.classList.remove('hidden');
                setTimeout(() => container.classList.add('hidden'), 5000);
            }
        });
    </script>
</body>
</html>
