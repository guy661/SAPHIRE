<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-Artikel-Zusammenfassung</title>
    
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bs-body-bg: #1a1a1a;
            --bs-body-color: #f0f0f0;
            --bs-primary-rgb: 78, 93, 229; /* A nice blue/purple accent */
            --bs-border-color-translucent: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Roboto', sans-serif;
        }

        .form-control, .btn {
            border-radius: 0.5rem;
            border: none;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
            border-color: rgba(var(--bs-primary-rgb), 0.5);
        }
        
        #loadBtn {
            transition: transform 0.1s ease-in-out;
        }

        #loadBtn:active {
            transform: scale(0.95);
        }

        .article-card {
            background-color: #262626;
            border: 1px solid var(--bs-border-color-translucent);
            border-radius: 0.75rem;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        .article-card .card-title a {
            text-decoration: none;
            color: var(--bs-body-color);
            transition: color 0.2s;
        }

        .article-card .card-title a:hover {
            color: rgba(var(--bs-primary-rgb), 1);
        }

        .summary-bullets {
            padding-left: 1.2rem;
        }

        .summary-bullets li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <main class="container mt-4">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold">KI-Artikel-Zusammenfassung</h1>
            <p class="lead text-body-secondary">Ihre tägliche Dosis KI-gestützter Nachrichtenzusammenfassungen.</p>
        </header>

        <!-- Search Form -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-8">
                <form id="searchForm" class="d-flex shadow-sm">
                    <input id="keyword" class="form-control form-control-lg me-2" type="search" placeholder="Geben Sie ein Thema ein, z.B. 'Quantencomputing'" aria-label="Search">
                    <select id="summaryLength" class="form-select form-select-lg me-2" aria-label="Summary length">
                        <option value="short">Kurz</option>
                        <option value="medium" selected>Mittel</option>
                        <option value="long">Lang</option>
                    </select>
                    <button id="loadBtn" class="btn btn-primary btn-lg" type="submit">
                        <i class="bi bi-search"></i> <span class="d-none d-md-inline">Zusammenfassen</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Results Area -->
        <div id="resultsArea">
            <div id="error-container" class="d-none"></div>
            <div id="dashboard" class="row g-4">
                <!-- Summaries will be injected here -->
            </div>
        </div>
    </main>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>    <script>
        console.log("Running script version 5 - Final Polish");
        const searchForm = document.getElementById("searchForm");
        const keywordInput = document.getElementById("keyword");
        const loadBtn = document.getElementById("loadBtn");
        const dashboardDiv = document.getElementById("dashboard");
        const errorContainer = document.getElementById("error-container");

        async function fetchRSS(keyword) {
            const res = await fetch(`/rss?keyword=${encodeURIComponent(keyword)}`);
            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.error || "RSS-Feed-Fehler");
            }
            return res.json();
        }

        async function summarizeArticles(articles, length) {
            const res = await fetch("/summarize", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ articles, length })
            });
            const data = await res.json();
            if (!res.ok) {
                throw data;
            }
            return data;
        }

        function renderError(error) {
            let message = error.error || "Ein unbekannter Fehler ist aufgetreten.";
            if (error.details) {
                message = "Einige Artikel konnten nicht verarbeitet werden. Bitte versuchen Sie ein anderes Thema oder eine andere Suchanfrage.<ul>";
                error.details.forEach(detail => {
                    message += `<li><a href="${detail.link}" target="_blank">${detail.link}</a>: ${detail.error}</li>`;
                });
                message += "</ul>";
            }
            errorContainer.classList.remove("d-none");
            errorContainer.innerHTML = `
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    <strong><i class="bi bi-exclamation-triangle-fill"></i> Hinweis:</strong> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        function renderDashboard(summaries) {
            dashboardDiv.innerHTML = "";
            if (summaries.length === 0) {
                dashboardDiv.innerHTML = `<div class="col-12 text-center"><p class="text-body-secondary">Es konnten keine Zusammenfassungen erstellt werden. Bitte versuchen Sie ein anderes Thema.</p></div>`;
                return;
            }
            summaries.forEach(a => {
                const col = document.createElement("div");
                col.className = "col-lg-6 col-xl-4";

                // Sanitize and format the summary text into bullet points
                const summaryHtml = a.summary
                    .split('\n')
                    .filter(line => line.trim().startsWith('*') || line.trim().startsWith('-'))
                    .map(line => `<li>${line.replace(/[\*\-]/, '').trim()}</li>`)
                    .join('');

                const card = `
                    <div class="card h-100 article-card">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">
                                <a href="${a.link}" target="_blank" rel="noopener noreferrer">${a.title}</a>
                            </h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary">${new Date(a.date).toLocaleDateString()}</h6>
                            <hr>
                            <ul class="summary-bullets">${summaryHtml}</ul>
                            <div class="mt-auto pt-2">
                                <a href="${a.link}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-primary btn-sm">
                                    Original lesen <i class="bi bi-box-arrow-up-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                col.innerHTML = card;
                dashboardDiv.appendChild(col);
            });
        }
        
        searchForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const keyword = keywordInput.value.trim();
            if (!keyword) {
                renderError({error: "Bitte geben Sie ein Thema für die Suche ein."});
                return;
            }
            
            const summaryLength = document.getElementById("summaryLength").value;

            errorContainer.classList.add("d-none");
            dashboardDiv.innerHTML = "";
            loadBtn.disabled = true;
            loadBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>`;

            try {
                const articles = await fetchRSS(keyword);
                const summaries = await summarizeArticles(articles, summaryLength); 
                renderDashboard(summaries);
            } catch (err) {
                renderError(err);
                console.error(err);
            } finally {
                loadBtn.disabled = false;
                loadBtn.innerHTML = `<i class="bi bi-search"></i> <span class="d-none d-md-inline">Zusammenfassen</span>`;
            }
        });
    </script>

</body>
</html>
