<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Summarizer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ======== AUTH CONTAINER ======== -->
    <div id="auth-container">
        <div class="card-ui">
            <h1 class="card-ui-title">Synapse Summarizer</h1>
            <p class="card-ui-subtitle">Log in or register to begin.</p>
            
            <div id="auth-error" class="alert alert-danger" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="login-username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="login-username" placeholder="Enter your username" required>
                </div>
                <div class="mb-4">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <!-- Register Form (initially hidden) -->
            <form id="registerForm" style="display: none;">
                <div class="mb-3">
                    <label for="register-username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="register-username" placeholder="Choose a username" required>
                </div>
                <div class="mb-4">
                    <label for="register-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="register-password" placeholder="Choose a password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>

            <div class="text-center mt-4">
                <a href="#" id="toggleAuth" class="btn-ghost">Need to create an account?</a>
            </div>
        </div>
    </div>

    <!-- ======== APP CONTAINER ======== -->
    <div id="app-container" class="d-none">
        <nav class="navbar">
            <span class="navbar-brand">SYNAPSE</span>
            <div>
                <a href="/personalization" class="btn-ghost" style="margin-right: 1rem;">Personalize</a>
                <span class="navbar-text">User: <strong id="username-display"></strong></span>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </nav>

        <main>
            <form id="searchForm">
                <i class="bi bi-search" style="color: var(--text-secondary-color);"></i>
                <input id="keyword" class="form-control" type="search" placeholder="Set a topic in Personalize to get started...">
                <select id="summaryLength" class="form-select" style="display: none;">
                    <option value="short">Short</option>
                    <option value="medium" selected>Medium</option>
                    <option value="long">Long</option>
                </select>
                <button id="loadBtn" class="btn btn-primary" type="submit">Get News</button>
            </form>

            <div id="resultsArea">
                <div id="error-container" class="d-none"></div>
                <div id="dashboard" class="mt-4"></div>
                <div id="loading-spinner" class="text-center mt-5" style="display: none;">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- General Elements ---
            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');
            const usernameDisplay = document.getElementById('username-display');
            const logoutBtn = document.getElementById('logoutBtn');

            // --- Auth Elements ---
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authError = document.getElementById('auth-error');
            const toggleAuthLink = document.getElementById('toggleAuth');
            let isLogin = true;

            // --- App Elements ---
            const searchForm = document.getElementById("searchForm");
            const keywordInput = document.getElementById("keyword");
            const summaryLength = document.getElementById("summaryLength");
            const dashboardDiv = document.getElementById("dashboard");
            const errorContainer = document.getElementById("error-container");
            const loadingSpinner = document.getElementById("loading-spinner");

            // --- API Service ---
            const api = {
                async request(endpoint, options = {}) {
                    options.credentials = 'include';
                    options.headers = { 'Content-Type': 'application/json', ...options.headers };
                    const res = await fetch(`/api${endpoint}`, options);
                    if (!res.ok) {
                        const errorData = await res.json().catch(() => ({ error: 'An unknown error occurred' }));
                        throw errorData;
                    }
                    // For logout, response might not be JSON
                    if (res.status === 200 && endpoint === '/logout') {
                         return { message: 'Logged out successfully' };
                    }
                    return res.json();
                },
                login(u, p) { return this.request('/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) }); },
                register(u, p) { return this.request('/register', { method: 'POST', body: JSON.stringify({ username: u, password: p }) }); },
                logout() { return this.request('/logout', { method: 'POST' }); },
                getUser() { return this.request('/user'); },
                getTopics() { return this.request('/topics'); },
                fetchRSS(keyword) { return fetch(`/api/rss?keyword=${encodeURIComponent(keyword)}`, { credentials: 'include' }); },
                summarize(articles, length) {
                    return fetch("/api/summarize", {
                        method: "POST",
                        credentials: 'include',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ articles, length })
                    });
                }
            };

            // --- UI Functions ---
            const showLogin = () => {
                appContainer.classList.add('d-none');
                authContainer.classList.remove('d-none');
            };

            const showApp = (user) => {
                usernameDisplay.textContent = user.username;
                authContainer.classList.add('d-none');
                appContainer.classList.remove('d-none');
            };
            
            const showAlert = (container, message) => {
                container.textContent = message;
                container.style.display = 'block';
            };
            
            const hideAlert = (container) => {
                container.style.display = 'none';
            };

            const toggleAuthView = () => {
                isLogin = !isLogin;
                hideAlert(authError);
                if (isLogin) {
                    loginForm.style.display = 'block';
                    registerForm.style.display = 'none';
                    toggleAuthLink.textContent = 'Need to create an account?';
                } else {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                    toggleAuthLink.textContent = 'Already have an account?';
                }
            };
            
            const renderDashboard = (articles) => {
                dashboardDiv.innerHTML = "";

                if (!articles || articles.length === 0) {
                    dashboardDiv.innerHTML = `<div class="text-center"><p style="color: var(--text-secondary-color);">No relevant articles found. Please try a different search term or adjust your personalization settings.</p></div>`;
                    return;
                }

                articles.forEach(a => {
                    const card = document.createElement("div");
                    card.className = "card-ui";
                    // The 'summary' is now the reason from the AI worker
                    const summaryText = a.summary || 'No summary provided.'; 
                    const isoDate = a.isoDate || new Date().toISOString();
                    card.innerHTML = `
                        <h5 class="card-title"><a href="${a.link}" target="_blank">${a.title}</a></h5>
                        <h6 class="card-subtitle mb-3">${new Date(isoDate).toLocaleDateString()}</h6>
                        <p class="card-text small"><em>AI's reasoning: ${summaryText.replace(/\*/g, '')}</em></p>
                        <a href="${a.link}" target="_blank" class="btn-ghost mt-3 d-inline-block">Read Full Article →</a>
                    `;
                    dashboardDiv.appendChild(card);
                });
            };
            
            const renderError = (container, error) => {
                const message = error.error || "An unknown error occurred.";
                container.innerHTML = `<div class="alert alert-danger">${message}</div>`;
                container.classList.remove('d-none');
            };

            // --- Event Listeners ---
            toggleAuthLink.addEventListener('click', (e) => {
                e.preventDefault();
                toggleAuthView();
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert(authError);
                try {
                    const user = await api.login(loginForm.elements['login-username'].value, loginForm.elements['login-password'].value);
                    showApp(user);
                    loadAppData();
                } catch (err) {
                    showAlert(authError, err.error || "Login failed.");
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert(authError);
                try {
                    const user = await api.register(registerForm.elements['register-username'].value, registerForm.elements['register-password'].value);
                    showApp(user);
                    loadAppData();
                } catch (err) {
                    showAlert(authError, err.error || "Registration failed.");
                }
            });

            logoutBtn.addEventListener('click', async () => {
                try {
                    await api.logout();
                    showLogin();
                } catch (err) {
                    console.error('Logout failed', err);
                }
            });

            searchForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const keyword = keywordInput.value.trim();
                
                if (keywordInput.disabled && !keyword) {
                    // Let it proceed with empty keyword
                } else if (!keyword) {
                    return;
                }

                dashboardDiv.innerHTML = '';
                errorContainer.classList.add('d-none');
                loadingSpinner.style.display = 'block';

                try {
                    const rssRes = await api.fetchRSS(keyword);
                    if (!rssRes.ok) {
                        const data = await rssRes.json();
                        if (rssRes.status === 401) showLogin();
                        throw new Error(data.error || "RSS Feed Error");
                    }
                    const { jobId } = await rssRes.json();

                    // Start polling for results
                    const articles = await pollForResult(jobId);
                    
                    renderDashboard(articles, null); // The results are already filtered, no meta-summary yet

                } catch (err) {
                    renderError(errorContainer, err);
                } finally {
                    loadingSpinner.style.display = 'none';
                }
            });

            async function pollForResult(jobId) {
                const pollInterval = 3000; // 3 seconds
                const maxDuration = 120000; // 2 minutes
                const startTime = Date.now();

                while (Date.now() - startTime < maxDuration) {
                    try {
                        const res = await fetch(`/api/results/${jobId}`, { credentials: 'include' });
                        if (!res.ok) {
                            if (res.status === 401) showLogin();
                            throw new Error("Could not fetch job results.");
                        }
                        
                        const result = await res.json();

                        if (result.status === 'completed') {
                            return result.articles;
                        } else if (result.status === 'failed') {
                            throw new Error("The article processing job failed.");
                        }
                        // If 'pending' or 'in_progress', just wait and poll again.
                        
                    } catch (error) {
                        // Re-throw to be caught by the main try-catch block
                        throw error;
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, pollInterval));
                }

                throw new Error("Request timed out. The server is taking too long to respond.");
            }
            
            async function loadAppData() {
                try {
                    const topic = await api.getTopics();
                    if (topic && topic.main_topic) {
                        keywordInput.value = `Your Topic: ${topic.main_topic}`;
                        keywordInput.disabled = true;
                    } else {
                        keywordInput.placeholder = "Set a topic in Personalize or search manually...";
                        keywordInput.disabled = false;
                    }
                } catch (error) {
                    console.error("Could not load topics", error);
                    keywordInput.placeholder = "Could not load topic. Search manually...";
                    keywordInput.disabled = false;
                }
            }

            // --- Initial Load ---
            (async () => {
                try {
                    const user = await api.getUser();
                    showApp(user);
                    loadAppData();
                } catch (err) {
                    showLogin();
                }
            })();
        });
    </script>
</body>
</html>
