services:
  - type: web
    name: ai-projekt
    env: node
    plan: free
    buildCommand: 'npm install'
    startCommand: 'npm start'
    preStartCommand: 'rm -f /data/db.sqlite && mkdir -p /data && chmod 777 /data'
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 18
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
    disks:
      - name: data
        mountPath: /data
        sizeGB: 1
